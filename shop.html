<body data-page="shop">
<div id="site-header"></div>
<main class="container">
  <div class="page-head">
    <div class="breadcrumb"><a href="index.html">Trang chủ</a> / <span data-crumb>Hàng sẵn</span></div>
    <h1 data-title>Tất cả hàng sẵn</h1>
    <p class="muted" style="margin:0">Tồn kho thay đổi trong ngày — nhắn shop xác nhận size trước khi chuyển khoản.</p>
  </div>
  <div class="shop">
    <aside class="filters" data-filters aria-label="Bộ lọc"></aside>
    <section>
      <div class="toolbar">
        <span class="toolbar__count" data-count></span>
        <button class="btn btn--ghost btn--sm filter-open" data-filters-open><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Bộ lọc <span data-filter-count></span></button>
        <label class="sr-only" for="sort">Sắp xếp</label>
        <select class="select" id="sort" data-sort>
          <option value="default">Mặc định</option>
          <option value="price-asc">Giá thấp → cao</option>
          <option value="price-desc">Giá cao → thấp</option>
          <option value="sizes">Còn nhiều size</option>
          <option value="name">Tên A → Z</option>
        </select>
      </div>
      <div class="active-filters" data-active hidden></div>
      <div class="grid" data-grid></div>
      <div class="load-more" data-more hidden><button class="btn btn--ghost">Xem thêm</button></div>
    </section>
  </div>
