<body data-page="shop">
<div id="site-header"></div>
<main id="main" class="container coll">
  <div class="pd-top" data-crumbs></div>
  <div class="coll-banner" data-collection-banner hidden></div>
  <div class="coll__head"><h1 class="coll__title" data-title>Giày chính hãng</h1></div>
  <nav class="chiprow" data-tiles aria-label="Chọn hãng / dòng giày"></nav>
  <div class="shop">
    <aside class="filters" data-filters aria-label="Bộ lọc">
      <div class="filters__backdrop" data-filters-close></div>
      <div class="filters__panel" role="dialog" aria-label="Bộ lọc">
        <div class="filters__head"><b>Bộ lọc</b><button type="button" class="icon-btn" data-filters-close aria-label="Đóng bộ lọc"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="filters__body"></div>
        <div class="filters__foot"><button type="button" class="btn btn--ghost" data-clear>Xoá lọc</button><button type="button" class="btn btn--grad" data-filters-close data-apply>Xem kết quả</button></div>
      </div>
    </aside>
    <section aria-label="Danh sách giày">
      <div class="toolbar">
        <button type="button" class="tool-btn" data-filters-open><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Bộ lọc <span data-filter-count></span></button>
        <p class="count-line" data-count aria-live="polite"></p>
        <label class="sr-only" for="sort">Sắp xếp</label>
        <select class="select" id="sort" data-sort>
          <option value="default">Nổi bật</option>
          <option value="price-asc">Giá thấp → cao</option>
          <option value="price-desc">Giá cao → thấp</option>
          <option value="sizes">Còn nhiều size</option>
          <option value="name-asc">Tên A → Z</option>
        </select>
      </div>
      <div class="chips" data-chips hidden></div>
      <div class="grid" data-grid></div>
      <div class="pager" data-pager></div>
    </section>
  </div>
  <div data-seen></div>
  <section class="about" data-about hidden>
    <h2></h2>
    <div class="about__body"></div>
    <button type="button" class="link" aria-expanded="false">Đọc thêm</button>
  </section>
</main>
<div id="site-footer"></div>
<script src="data/shop.js"></script>
<script src="data/products.js"></script>
<script src="images/products/danh-sach.js"></script>
<script src="images/anh-khac.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
