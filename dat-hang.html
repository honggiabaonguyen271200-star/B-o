<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đặt hàng — S&amp;LIFE Sneakers</title>
<meta name="description" content="S&amp;LIFE Sneakers — giày chính hãng New Balance, Asics, Onitsuka Tiger, Jordan, Nike, Adidas, Puma. Hàng sẵn, đồng kiểm khi nhận, đổi size 3 ngày.">
<meta property="og:title" content="Đặt hàng — S&amp;LIFE Sneakers">
<meta property="og:description" content="S&amp;LIFE Sneakers — giày chính hãng New Balance, Asics, Onitsuka Tiger, Jordan, Nike, Adidas, Puma. Hàng sẵn, đồng kiểm khi nhận, đổi size 3 ngày.">
<meta name="theme-color" content="#111111">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial' font-weight='700' font-size='26' fill='%23fff'%3ES%26L%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="checkout">
<div id="site-header"></div>
<main>
<main class="container">
  <div class="co" data-checkout>
    <div>
      <div class="co__steps"><a href="cart.html">Giỏ hàng</a> › <span data-crumb-step="1">Thông tin giao hàng</span> › <span data-crumb-step="2">Thanh toán</span> › <span data-crumb-step="3">Gửi đơn</span></div>

      <section data-step="1">
        <h2>Thông tin giao hàng</h2>
        <form data-co-form novalidate>
          <div class="field"><label for="co-name">Họ và tên</label><input id="co-name" name="name" autocomplete="name" required></div>
          <div class="co__two">
            <div class="field"><label for="co-phone">Số điện thoại</label><input id="co-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required></div>
            <div class="field"><label for="co-email">Email (không bắt buộc)</label><input id="co-email" name="email" type="email" autocomplete="email"></div>
          </div>
          <div class="field"><label for="co-province">Tỉnh / thành</label><select id="co-province" name="province" required></select></div>
          <div class="field"><label for="co-address">Địa chỉ (số nhà, đường, phường / xã)</label><input id="co-address" name="address" autocomplete="street-address" required></div>
          <div class="co__two">
            <div class="field"><label for="co-foot">Chiều dài bàn chân (cm)</label><input id="co-foot" name="foot" inputmode="decimal" placeholder="VD: 25"><span class="hint">Shop kiểm tra lại size giúp. <a href="size-guide.html" style="text-decoration:underline">Cách đo</a></span></div>
            <div class="field"><label for="co-note">Ghi chú</label><input id="co-note" name="note" placeholder="VD: giao giờ hành chính"></div>
          </div>
          <label class="agree"><input type="checkbox" name="agree" checked> <span>Tôi đồng ý để S&amp;LIFE Sneakers dùng thông tin trên để xác nhận và giao đơn hàng, theo <a href="chinh-sach-bao-mat.html" target="_blank">chính sách bảo mật</a>.</span></label>
          <div class="co__nav"><a href="cart.html">‹ Giỏ hàng</a><button class="btn" type="submit">Tiếp tục đến phương thức thanh toán</button></div>
        </form>
      </section>

      <section data-step="2" hidden>
        <h2>Phương thức thanh toán</h2>
        <div class="co__pay">
          <div>
            <div class="pay-opt"><label><input type="radio" name="pay" value="cod" checked> Thanh toán khi nhận hàng (COD)</label><div class="pay-opt__body" data-cod-text></div></div>
            <div class="pay-opt"><label><input type="radio" name="pay" value="bank"> Chuyển khoản ngân hàng</label><div class="pay-opt__body" data-bank-text></div></div>
          </div>
          <p class="muted" style="font-size:13.5px;margin:0">Sau khi hoàn tất, website tạo mã QR chuyển khoản có sẵn số tiền và mã đơn. Bạn nên chờ shop xác nhận còn size rồi hẵng chuyển.</p>
          <div class="co__nav"><button class="link" type="button" data-back>‹ Thông tin giao hàng</button><button class="btn" type="button" data-finish>Hoàn tất đơn hàng</button></div>
        </div>
      </section>

      <section data-step="3" hidden><div data-done></div></section>
    </div>
    <aside class="co__summary" data-summary></aside>
  </div>
</main>
<div id="site-footer"></div>
<script src="data/shop.js"></script>
<script src="data/products.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
